# Dépendances de l'API en développement.
#   docker compose up -d      démarrer
#   docker compose down       arrêter, données conservées
#   docker compose down -v    arrêter et supprimer les données

services:
  db:
    image: postgres:17-alpine
    container_name: portal-db
    environment:
      # identifiants de développement uniquement
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      # exposé sur l'hôte pour lancer l'API avec go run hors conteneur
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # savoir si la base est prête, pas seulement démarrée
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: portal-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # pas de volume : un cache est jetable, il se re-remplit depuis la base

volumes:
  pgdata:
